# Monitors
monitor=eDP-1,preferred,auto,1

# Programs & Modifiers
$terminal = ptyxis
$menu = nwg-drawer -c 6 -is 36 -k -ov
$mainMod = SUPER

# Core Navigation & Window Controls
bind = $mainMod, Q, killactive,
bind = CTRL ALT, Delete, exit,
bind = $mainMod, V, togglefloating,

# Focus Navigation (Arrows)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Custom App Launchers
bind = $mainMod, A, exec, nwg-drawer
bind = $mainMod, C, exec, code
bind = $mainMod, G, exec, steam
bind = $mainMod, B, exec, brave-origin
bind = CTRL ALT, T, exec, $terminal
bind = $mainMod, E, exec, nautilus
bind = $mainMod, I, exec, env XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bind = $mainMod SHIFT, Escape, exec, ptyxis -e btop

# Autostart
exec-once = waybar
exec-once = swaybg -i ~/.config/hypr/wallpaper.jpg -m fill
exec-once = nm-applet --indicator
exec-once = /usr/libexec/lxqt-policykit-agent

# WOB (Wayland Overlay Bar) Pipe Daemon
exec-once = rm -f $XDG_RUNTIME_DIR/wob.sock && mkfifo $XDG_RUNTIME_DIR/wob.sock && tail -f $XDG_RUNTIME_DIR/wob.sock | wob

# Workspaces Switch
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Workspaces Move Window
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Waybar Reload Keybind
bind = CTRL SHIFT ALT, B, exec, killall waybar 2>/dev/null; waybar &

# Window Decoration
decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 0
    col.active_border = rgba(332d41ee)
    col.inactive_border = rgba(221630aa)
    resize_on_border = true
    hover_icon_on_border = true
}

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (Saved to ~/Pictures/Screenshots & copied to clipboard)
bind = , Print, exec, bash -c 'grim - | tee "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png" | wl-copy -t image/png'
bind = $mainMod, Print, exec, bash -c 'grim -g "$(slurp)" - | tee "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png" | wl-copy -t image/png'
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/screenshot-active.sh

# GNOME Control Center Window Rules
windowrule = match:class ^(gnome-control-center)$, float on
windowrule = match:class ^(gnome-control-center)$, size 1050 720
windowrule = match:class ^(gnome-control-center)$, center on

# Dedicated Fn + F-Keys
# F1: Audio Mute
bind = , XF86AudioMute, exec, pamixer -t && ( [ "$(pamixer --get-mute)" = "true" ] && echo 0 > $XDG_RUNTIME_DIR/wob.sock || pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock )
# F2 & F3: Volume Down & Up
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 && pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 && pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock
# F4 & F5: Brightness Down & Up
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- | sed -En 's/.*\(([0-9]+)%\).*/\1/p' > $XDG_RUNTIME_DIR/wob.sock
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ | sed -En 's/.*\(([0-9]+)%\).*/\1/p' > $XDG_RUNTIME_DIR/wob.sock
# F9: Mic Mute
bind = , XF86AudioMicMute, exec, pamixer --default-source -t

# Workspace switch via Super + Scroll (GNOME behavior)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Kill Focused Window (Super + Shift + K)
bind = $mainMod SHIFT, K, exec, hyprctl kill

exec-once = blueman-applet


