# Monitors
monitor=eDP-1,preferred,auto,1

# Programs & Modifiers
$terminal = ptyxis
$menu = nwg-drawer -c 6 -is 36 -k -ov
$mainMod = SUPER

# Autostart
exec-once = waybar
exec-once = swaybg -i ~/.config/hypr/wallpaper.jpg -m fill
exec-once = nm-applet --indicator
exec-once = /usr/libexec/lxqt-policykit-agent
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
# WOB (Wayland Overlay Bar) Pipe Daemon
exec-once = rm -f $XDG_RUNTIME_DIR/wob.sock && mkfifo $XDG_RUNTIME_DIR/wob.sock && tail -f $XDG_RUNTIME_DIR/wob.sock | wob
exec-once = blueman-applet

input {
    # Strictly US ANSI layout so semicolon, colon, quotes, and @ never get displaced
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0
}

misc {
    enable_swallow = false
}

bind = CTRL ALT, Delete, exit,

# Custom App Launchers
bind = $mainMod, C, exec, code
bind = $mainMod, G, exec, steam
bind = $mainMod, B, exec, brave-origin
bind = CTRL ALT, T, exec, $terminal
bind = $mainMod, E, exec, thunar
bind = $mainMod, I, exec, env XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bind = $mainMod SHIFT, Escape, exec, ptyxis -e btop

# Custom Scripts
bind = $mainMod, A, exec, python3 ~/.config/hypr/scripts/drawer.py
bind = $mainMod, S, exec, python3 ~/.config/hypr/scripts/quicksettings.py

# Waybar Reload Keybind
bind = CTRL SHIFT ALT, B, exec, killall waybar 2>/dev/null; waybar &

# ==============================================================================
# Window Management binds & rules
# ==============================================================================
windowrule = match:class ^(gnome-control-center)$, float on
windowrule = match:class ^(gnome-control-center)$, size 1050 720
windowrule = match:class ^(gnome-control-center)$, center on

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.75

    blur {
        enabled = true
        size = 10
        passes = 2
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 0
    col.active_border = rgba(332d41ee)
    col.inactive_border = rgba(221630aa)
    resize_on_border = true
    hover_icon_on_border = true
}

# Workspaces Switch [SUPER + 1-0]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Workspace switch [SUPER + Mouse_Scroll]
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Workspaces Move Window [SUPER + SHIFT + 1-0]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Focus Navigation (Arrows)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Kill Focused Window
bind = $mainMod SHIFT, K, exec, hyprctl kill
bind = $mainMod, Q, killactive,
bind = $mainMod, F11, togglefloating,

# Screenshots using hyprshot with dynamic timestamp
bind = , Print, exec, /home/irys/.local/bin/hyprshot -m output -o /home/irys/Pictures/Screenshots -f "Screenshot from $(date +'%Y-%m-%d %H-%M-%S').png"
bind = $mainMod, Print, exec, /home/irys/.local/bin/hyprshot -m region -o /home/irys/Pictures/Screenshots -f "Screenshot from $(date +'%Y-%m-%d %H-%M-%S').png"
bind = $mainMod SHIFT, S, exec, /home/irys/.local/bin/hyprshot -m window -o /home/irys/Pictures/Screenshots -f "Screenshot from $(date +'%Y-%m-%d %H-%M-%S').png"

# ==============================================================================
# FUNCTION ROW CONTROLS (F1 - F12) [SUPER + F1 - F12]
# ==============================================================================
bind = , XF86AudioMute, exec, pamixer -t && ( [ "$(pamixer --get-mute)" = "true" ] && echo 0 > $XDG_RUNTIME_DIR/wob.sock || pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock )
bind = $mainMod, F1, exec, pamixer -t && ( [ "$(pamixer --get-mute)" = "true" ] && echo 0 > $XDG_RUNTIME_DIR/wob.sock || pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock )
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 && pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock
bind = $mainMod, F2, exec, pamixer -d 5 && pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 && pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock
bind = $mainMod, F3, exec, pamixer -i 5 && pamixer --get-volume > $XDG_RUNTIME_DIR/wob.sock
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- | sed -En 's/.*\(([0-9]+)%\).*/\1/p' > $XDG_RUNTIME_DIR/wob.sock
bind = $mainMod, F4, exec, brightnessctl set 5%- | sed -En 's/.*\(([0-9]+)%\).*/\1/p' > $XDG_RUNTIME_DIR/wob.sock
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ | sed -En 's/.*\(([0-9]+)%\).*/\1/p' > $XDG_RUNTIME_DIR/wob.sock
bind = $mainMod, F5, exec, brightnessctl set 5%+ | sed -En 's/.*\(([0-9]+)%\).*/\1/p' > $XDG_RUNTIME_DIR/wob.sock
bind = $mainMod, F6, exec, ~/.config/hypr/scripts/toggle-laptop-inputs.sh
bind = , XF86Display, exec, hyprctl dispatch dpms toggle
bind = $mainMod, F8, exec, hyprctl dispatch dpms toggle
bind = , XF86AudioMicMute, exec, pamixer --default-source -t
bind = $mainMod, F9, exec, pamixer --default-source -t
bind = , F11, fullscreen, 0